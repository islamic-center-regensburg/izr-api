---
version: '3.9'

services:
  db:
    image: postgres:16-alpine
    volumes:
    - db_data:/var/lib/postgresql/data/
    ports:
    - 5432:5432
    environment:
    - POSTGRES_USER=${DB_ADMIN_USERNAME}
    - POSTGRES_PASSWORD=${DB_ADMIN_PASSWORD}
    - POSTGRES_DB=${DB_NAME}
    networks:
    - izr-api-net
volumes:
  db_data:
